name: 抓取最新公告

on:
  schedule:
    # 每 30 分钟一次（UTC 07/37 分，对应北京时间 15/45 分，避开整半点拥堵）
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 抓取六类公告
        run: node scripts/crawl.mjs

      - name: 提交更新的数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/api
          if git diff --cached --quiet; then
            echo "没有新数据，跳过提交"
          else
            git commit -m "data: 刷新公告 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
