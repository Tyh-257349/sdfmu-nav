name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  # 抓取任务用 GITHUB_TOKEN 推送的数据提交不会触发 push 事件，
  # 用 workflow_run 在抓取完成后接力部署
  workflow_run:
    workflows: ["抓取最新公告"]
    types: [completed]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖并构建
        run: npm ci && npm run build
        env:
          # 若仓库名不是 sdfmu-nav，改成 /仓库名/
          GH_PAGES_BASE: /sdfmu-nav/

      # SPA 路由回退：GitHub Pages 对未知路径返回 404.html
      - name: 生成 404 回退页
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
